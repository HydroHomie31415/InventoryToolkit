plugins {
	id "net.fabricmc.fabric-loom" version "${loom_version}"
	id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archive_base_name
}

repositories {
	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/releases/"
	}
	maven {
		name = "Shedaniel"
		url = "https://maven.shedaniel.me/"
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"inventory_toolkit" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "com.terraformersmc:modmenu:${project.modmenu_version}"
	implementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.compilerArgs += ["-Xlint:all", "-Xlint:-processing"]
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

def pandoraModsDirectory =
		file("/home/luka/.local/share/PandoraLauncher/instances/26.2/.minecraft/mods")

tasks.register("installToPandora", Copy) {
	group = "distribution"
	description = "Installs Inventory Toolkit into the PandoraLauncher 26.2 instance."
	dependsOn tasks.named("jar")

	from tasks.named("jar").flatMap { it.archiveFile }
	into pandoraModsDirectory

	doFirst {
		pandoraModsDirectory.mkdirs()
		delete fileTree(pandoraModsDirectory) {
			include "${project.archive_base_name}-*.jar"
			include "shift-drag-transfer-*.jar"
		}
	}
}

tasks.named("build") {
	finalizedBy tasks.named("installToPandora")
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}
